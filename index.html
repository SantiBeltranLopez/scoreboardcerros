<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Classroom Scoreboard</title>
  <!-- Retro 8-bit Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Arcade Cabinet Wrapper -->
  <div class="arcade-cabinet">

    <!-- Arcade Header -->
    <header class="arcade-header">
      <div class="header-top-bar">
        <span class="hud-pill hud-world">WORLD 1-1</span>
        <span class="hud-pill hud-blink">PRESS START</span>
        <span class="hud-pill hud-coins">🪙 x99</span>
      </div>
      <div class="header-title-container">
        <h1 class="arcade-title">
          <span class="pixel-star">⭐</span> ARCADE WEEKLY SCOREBOARD <span class="pixel-star">⭐</span>
        </h1>
        <p class="arcade-subtitle">CHAMPIONS OF THE WEEK</p>
      </div>
    </header>

    <!-- Grade Selector Tabs -->
    <nav class="grade-nav" aria-label="Grade Selector">
      <button class="grade-tab-btn active" data-grade="1">
        <span class="tab-icon">🍄</span> 1ST GRADE
      </button>
      <button class="grade-tab-btn" data-grade="2">
        <span class="tab-icon">⭐</span> 2ND GRADE
      </button>
      <button class="grade-tab-btn" data-grade="3">
        <span class="tab-icon">💎</span> 3RD GRADE
      </button>
    </nav>

    <!-- Dynamic Teams Container -->
    <main id="teams-container" class="teams-grid">
      <!-- Dynamically generated by app.js -->
    </main>

    <!-- Fixed Bottom Toolbar -->
    <footer class="toolbar-footer">
      <div class="toolbar-buttons">
        <button id="btn-winner" class="arcade-tool-btn btn-action-winner">
          <span class="btn-icon">🏆</span> DECLARE WINNER
        </button>
        <button id="btn-reset" class="arcade-tool-btn btn-action-reset">
          <span class="btn-icon">🔄</span> RESET WEEK
        </button>
        <button id="btn-export" class="arcade-tool-btn btn-action-export">
          <span class="btn-icon">💾</span> SAVE BACKUP (.JSON)
        </button>
        <button id="btn-import-trigger" class="arcade-tool-btn btn-action-import">
          <span class="btn-icon">📂</span> LOAD BACKUP
        </button>
        <!-- Hidden file input for JSON import -->
        <input type="file" id="file-import" accept=".json" class="hidden-file-input">
      </div>
    </footer>

  </div>

  <!-- Retro Victory Modal (STAGE CLEAR / YOU WIN) -->
  <div id="winner-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="winner-modal-box">
      <div class="modal-header-banner">
        <p class="blink-text">★ ★ ★ ★ ★</p>
        <h2 class="modal-title">STAGE CLEAR!</h2>
        <p class="modal-subtitle">YOU WIN THE WEEK!</p>
      </div>

      <div class="winner-trophy-box">
        <div class="trophy-sprite">🏆</div>
        <div class="sparkles-row">✨ 🪙 ✨</div>
      </div>

      <div class="winner-info-card">
        <p class="winner-grade-tag" id="winner-grade-text">1ST GRADE - ELEMENTARY</p>
        <h3 class="winner-name-display" id="winner-team-name">GOLD COIN</h3>
        <div class="winner-score-display">
          <span class="label">HIGH SCORE:</span>
          <span class="score" id="winner-score-val">150 PTS</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="btn-close-winner" class="arcade-tool-btn btn-close-modal">
          CONTINUE [PRESS START]
        </button>
      </div>
    </div>
  </div>
</body>
</html>
